[platformio]
src_dir = src
include_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usb*
monitor_port = /dev/cu.usb*
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/refs/tags/4.6.1.zip
